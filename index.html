<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추첨기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>로또 번호 추첨기</h1>
    <p>버튼을 눌러 1개 또는 여러 개의 로또 번호 세트를 생성하세요.</p>

    <div class="controls">
      <label for="sets">생성할 세트 개수:</label>
      <input id="sets" type="number" min="1" max="10" value="1" />
      <button id="drawButton">번호 추첨</button>
    </div>

    <div id="result" class="result"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
